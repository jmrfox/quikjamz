[project]
name = "quikjamz"
version = "0.2.0"
description = "Randomly generated jam guides for improvising groups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "pyyaml>=6.0",
    "typst>=0.15.0",
]

[project.scripts]
quikjamz = "quikjamz.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quikjamz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
